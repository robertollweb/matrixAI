# CONTRATO 111-C1. Este fichero es DELIBERADAMENTE tonto.
#
# Nadie puede probar un `action.yml` fuera de GitHub, así que aquí no decide
# nada: pasa entradas y recoge lo que el módulo devuelve. Todo lo que decide
# —qué alcances quedaron sin realizar, qué pone el resumen, con qué código
# sale el trabajo y si hay que instalar `matrixai-engines`— vive en
# `matrixai/ci/verify_action.py`, en Python, donde la suite lo prueba y se
# puede sabotear. Si este YAML crece, es que algo se ha escapado al sitio
# que nadie puede medir.
name: matrixai verify
description: >-
  Verifies a MatrixAI package and fails the job with the verdict and the
  scopes that were NOT carried out.

inputs:
  package:
    description: Path to the package (.zip or extracted directory).
    required: true
  require:
    description: >-
      Scopes that must have been carried out, comma-separated, or "all".
      Defaults to manifest,R1 — the two a foreign machine CAN carry out.
      This can only TIGHTEN: it never turns a failure green.
    required: false
    default: manifest,R1
  retrain:
    description: Pass --retrain to verify (needed for training and R3).
    required: false
    default: 'false'
  engines:
    description: >-
      auto (install matrixai-engines only if the package asks for it),
      skip, or an explicit requirement string.
    required: false
    default: auto
  locale:
    description: es or en.
    required: false
    default: en
  matrixai-version:
    description: Version spec for matrixai-core, e.g. "==1.7.1".
    required: false
    default: ''

runs:
  using: composite
  steps:
    # 1/3 — el intérprete. Sin versión fijada aquí a propósito: quien use la
    # acción decide la suya con `actions/setup-python` antes, que es donde su
    # flujo ya declara el resto de su entorno.
    - name: Install matrixai-core
      shell: bash
      run: python -m pip install --disable-pip-version-check "matrixai-core${{ inputs.matrixai-version }}"

    # 2/3 — TODO lo que decide. `matrixai-engines` se instala AQUÍ DENTRO y
    # solo si el paquete lo pide: instalarlo siempre haría que un paquete que
    # declara no necesitarlo se verificara igual, tapando justo el fallo que
    # `verify` existe para encontrar.
    - name: Verify
      shell: bash
      run: |
        python -m matrixai.ci.verify_action \
          --package "${{ inputs.package }}" \
          --require "${{ inputs.require }}" \
          --retrain "${{ inputs.retrain }}" \
          --engines "${{ inputs.engines }}" \
          --locale  "${{ inputs.locale }}" \
          --report  "${RUNNER_TEMP:-/tmp}/matrixai-verify.json"

    # 3/3 — el informe crudo, SIEMPRE, también cuando el paso anterior falló.
    # Un trabajo rojo sin el informe obliga a repetir la verificación para
    # saber qué pasó, y repetirla puede dar otra cosa.
    - name: Upload verify report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: matrixai-verify-report
        path: ${{ runner.temp }}/matrixai-verify.json
        if-no-files-found: warn

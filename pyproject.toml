[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixai-core"
version = "1.22.0"
description = "Auditable AI model language, runtime and deployment framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roberto Llamosas Conde" }]
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://matrixaistudio.org"
Repository = "https://github.com/robertollweb/matrixAI"
Documentation = "https://github.com/robertollweb/matrixAI/tree/main/docs"
"Bug Tracker" = "https://github.com/robertollweb/matrixAI/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
export = ["onnx>=1.14", "onnxruntime>=1.14", "numpy>=1.24"]
torch = ["torch>=2.0"]
# Firma asimétrica Ed25519 de los recibos (145-C1). Opcional: sin ella, el recibo se firma
# con HMAC como siempre y la Ed25519 dice «falta cryptography».
firma = ["cryptography>=41"]
# Abrir Excel (.xlsx, .xlsm, .xls) como tabla (150-C1, `matrixai.tablas`). Opcional: sin él, el módulo se
# importa y un libro de Excel dice «falta el lector». Versión medida en el Paso 0: 0.9.0 (MIT, ~3 MB).
tablas = ["python-calamine>=0.9.0,<0.10"]
# Abrir Parquet como tabla (150-C8, `matrixai.tablas.parquet_lector`). Opcional y APARTE de `tablas`: pyarrow pesa ~163 MB
# instalado (calamine, ~3 MB), así que el Excel no lo arrastra. Sin él, un Parquet dice «instala pyarrow» y Excel sigue
# funcionando. Versión medida en C8: 26.0.1 (Apache-2.0).
parquet = ["pyarrow>=26.0.1,<27"]

[project.scripts]
matrixai = "matrixai.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["matrixai*"]

[tool.setuptools.package-data]
# Todo fichero que NO es Python y que el paquete lee en tiempo de ejecución va
# aquí, o no viaja en la rueda. Medido el 2026-09-17 construyendo la 1.8.0 en un
# contenedor limpio: `text/embeddings/catalogo_medido.json` faltaba, y desde el
# árbol editable todo pasaba. `tests/test_la_rueda_lleva_los_datos_del_paquete.py`
# compara cada fichero con esta lista.
matrixai = ["templates/**/*", "text/embeddings/*.json"]
